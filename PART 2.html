<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kanji Flashcards</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --green: #808b65;
            --green-dark: #596343;
            --green-light: #a7b18b;
            --cream: #f7f6ef;
            --white: #ffffff;
            --text: #30342a;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            color: var(--text);
            overflow-x: hidden;
            position: relative;

            background:
                radial-gradient(
                    circle at 10% 20%,
                    rgba(255, 255, 255, 0.18),
                    transparent 25%
                ),
                radial-gradient(
                    circle at 90% 80%,
                    rgba(255, 255, 255, 0.12),
                    transparent 25%
                ),
                linear-gradient(
                    135deg,
                    #596343,
                    #808b65,
                    #6e7955
                );

            background-size: 180% 180%;
            animation: backgroundMove 12s ease infinite;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: clamp(20px, 4vw, 60px);
        }

        /* =========================
           BACKGROUND
        ========================= */

        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(2px);
            opacity: 0.18;
            background: white;

            animation: float 12s ease-in-out infinite;
        }

        .blob:nth-child(1) {
            width: 180px;
            height: 180px;
            top: 5%;
            left: -40px;
        }

        .blob:nth-child(2) {
            width: 260px;
            height: 260px;
            right: -90px;
            top: 25%;
            animation-delay: 2s;
        }

        .blob:nth-child(3) {
            width: 140px;
            height: 140px;
            bottom: 5%;
            left: 10%;
            animation-delay: 4s;
        }

        .blob:nth-child(4) {
            width: 200px;
            height: 200px;
            bottom: -60px;
            right: 15%;
            animation-delay: 6s;
        }

        /* =========================
           ANIMATION
        ========================= */

        @keyframes float {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(25px, -30px) scale(1.12);
            }
        }

        @keyframes backgroundMove {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        @keyframes fadeDown {
            from {
                opacity: 0;
                transform: translateY(-15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes cardEnter {
            from {
                opacity: 0.3;
                transform: translateY(8px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* =========================
           CONTAINER
        ========================= */

        .container {
            width: 100%;
            max-width: clamp(520px, 65vw, 900px);

            position: relative;
            z-index: 2;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            text-align: center;
            color: white;

            margin-bottom: clamp(18px, 3vw, 30px);

            animation: fadeDown 0.7s ease;
        }

        .header h1 {
            font-size: clamp(1.9rem, 4vw, 3.5rem);
            font-weight: 800;
            letter-spacing: -1px;

            margin-bottom: clamp(5px, 1vw, 10px);
        }

        .header p {
            font-size: clamp(0.8rem, 1.5vw, 1.15rem);
            opacity: 0.85;
        }

        /* =========================
           PROGRESS
        ========================= */

        .progress-wrapper {
            margin-bottom: clamp(15px, 2.5vw, 25px);
        }

        .progress-info {
            display: flex;
            justify-content: space-between;

            color: white;

            font-size: clamp(0.75rem, 1.4vw, 1rem);

            margin-bottom: 7px;
            opacity: 0.9;
        }

        .progress-bar {
            width: 100%;
            height: clamp(7px, 1vw, 11px);

            background: rgba(255, 255, 255, 0.2);

            border-radius: 20px;
            overflow: hidden;

            backdrop-filter: blur(5px);
        }

        .progress-fill {
            width: 0%;
            height: 100%;

            border-radius: 20px;
            background: white;

            transition: width 0.45s ease;
        }

        /* =========================
           MODES
        ========================= */

        .modes {
            display: flex;
            justify-content: center;

            gap: clamp(6px, 1vw, 12px);

            margin-bottom: clamp(15px, 2.5vw, 25px);
        }

        .mode-btn {
            border: 1px solid rgba(255, 255, 255, 0.25);

            background: rgba(255, 255, 255, 0.12);

            color: white;

            padding:
                clamp(7px, 1.2vw, 12px)
                clamp(11px, 2vw, 22px);

            border-radius: 30px;

            font-size: clamp(0.75rem, 1.4vw, 1rem);

            cursor: pointer;

            transition: 0.25s ease;

            backdrop-filter: blur(10px);
        }

        .mode-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .mode-btn.active {
            background: white;
            color: var(--green-dark);

            font-weight: bold;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.12);
        }

        /* =========================
           CARD
        ========================= */

        .card-container {
            perspective: 1400px;
            margin-bottom: clamp(17px, 3vw, 30px);
        }

        .card {
            height: clamp(280px, 40vw, 450px);
            width: 100%;

            position: relative;

            transform-style: preserve-3d;

            /* Flip diperlambat */
            transition:
                transform 1.1s
                cubic-bezier(0.22, 0.61, 0.36, 1);

            cursor: pointer;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        /* =========================
           CARD FACE
        ========================= */

        .card-face {
            position: absolute;
            inset: 0;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            background: rgba(255, 255, 255, 0.96);

            border-radius: clamp(22px, 3vw, 35px);

            padding: clamp(20px, 4vw, 40px);

            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;

            box-shadow:
                0 25px 60px rgba(30, 40, 20, 0.22),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);

            overflow: hidden;
        }

        .card-face::before {
            content: "";

            position: absolute;

            width: clamp(140px, 20vw, 220px);
            height: clamp(140px, 20vw, 220px);

            border-radius: 50%;

            background: rgba(128, 139, 101, 0.08);

            top: -80px;
            right: -50px;
        }

        .card-back {
            transform: rotateY(180deg);
        }

        /* =========================
           LABEL
        ========================= */

        .card-label {
            position: absolute;

            top: clamp(17px, 2.5vw, 25px);
            left: clamp(18px, 2.5vw, 28px);

            font-size: clamp(0.65rem, 1.2vw, 0.85rem);

            color: var(--green);

            font-weight: bold;
            letter-spacing: 1px;

            text-transform: uppercase;
        }

        /* =========================
           KANJI
        ========================= */

        .kanji {
            font-size: clamp(3.5rem, 10vw, 7rem);

            font-weight: 700;

            color: var(--text);

            text-align: center;

            line-height: 1.35;

            word-break: break-word;

            z-index: 1;
        }

        /* =========================
           HIRAGANA
        ========================= */

        .hiragana {
            font-size: clamp(2rem, 5vw, 3.5rem);

            font-weight: 700;

            color: var(--green-dark);

            text-align: center;

            line-height: 1.4;

            z-index: 1;

            margin-bottom: 10px;
        }

        /* =========================
           MEANING
        ========================= */

        .meaning {
            font-size: clamp(1.4rem, 3.5vw, 2.5rem);

            font-weight: 600;

            color: var(--text);

            text-align: center;

            line-height: 1.4;

            word-break: break-word;

            z-index: 1;
        }

        /* =========================
           HINT
        ========================= */

        .flip-hint {
            position: absolute;

            bottom: clamp(18px, 2.5vw, 28px);

            font-size: clamp(0.7rem, 1.2vw, 0.9rem);

            color: #999;
        }

        /* =========================
           CONTROLS
        ========================= */

        .controls {
            display: grid;

            grid-template-columns: 1fr 1fr 1fr;

            gap: clamp(7px, 1.2vw, 14px);

            margin-bottom: clamp(18px, 3vw, 28px);
        }

        .btn {
            border: none;

            border-radius: clamp(13px, 2vw, 18px);

            padding:
                clamp(12px, 1.8vw, 17px)
                8px;

            font-size: clamp(0.75rem, 1.4vw, 1rem);

            font-weight: bold;

            cursor: pointer;

            transition: 0.25s ease;
        }

        .btn:hover {
            transform: translateY(-3px);
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-prev {
            background: rgba(255, 255, 255, 0.88);
            color: var(--green-dark);
        }

        .btn-flip {
            background: var(--green-dark);
            color: white;

            box-shadow:
                0 7px 20px rgba(40, 50, 25, 0.25);
        }

        .btn-next {
            background: white;
            color: var(--green-dark);
        }

        .btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none;
        }

        /* =========================
           STATS
        ========================= */

        .stats {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: clamp(7px, 1.2vw, 13px);
        }

        .stat-item {
            text-align: center;

            color: white;

            padding:
                clamp(10px, 1.8vw, 16px)
                5px;

            border-radius:
                clamp(14px, 2vw, 19px);

            background:
                rgba(255, 255, 255, 0.1);

            backdrop-filter: blur(10px);
        }

        .stat-number {
            display: block;

            font-size:
                clamp(1rem, 2vw, 1.4rem);

            font-weight: bold;

            margin-bottom: 3px;
        }

        .stat-label {
            font-size:
                clamp(0.65rem, 1.1vw, 0.8rem);

            opacity: 0.75;
        }

        /* =========================
           CARD ENTER
        ========================= */

        .card-enter {
            animation: cardEnter 0.45s ease;
        }

        /* =========================
           TABLET
        ========================= */

        @media (min-width: 600px) {
            .container {
                max-width: 700px;
            }
        }

        /* =========================
           DESKTOP
        ========================= */

        @media (min-width: 900px) {
            .container {
                max-width: 820px;
            }

            .card {
                height: 430px;
            }
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 480px) {
            body {
                padding: 18px 12px;
            }

            .card {
                height: 300px;
            }

            .controls {
                gap: 7px;
            }

            .btn {
                padding: 12px 5px;
                font-size: 0.78rem;
            }

            .mode-btn {
                padding: 7px 11px;
                font-size: 0.78rem;
            }
        }
    </style>
</head>

<body>

    <script>

        /* =====================================================

        const questions = [

                meaning: "Waktu"
            }

        ];


        /* =====================================================
           VARIABLES
        ===================================================== */

        let currentIndex = 0;
        let isFlipped = false;
        let mode = "sequential";

        let shuffledIndices = [];
        let reviewIndices = [];


        /* =====================================================
           ELEMENTS
        ===================================================== */

        const card =
            document.getElementById("flashcard");

        const kanjiDisplay =
            document.getElementById("kanjiDisplay");

        const hiraganaDisplay =
            document.getElementById("hiraganaDisplay");

        const meaningDisplay =
            document.getElementById("meaningDisplay");

        const flipBtn =
            document.getElementById("flipBtn");

        const nextBtn =
            document.getElementById("nextBtn");

        const prevBtn =
            document.getElementById("prevBtn");

        const progressFill =
            document.getElementById("progressFill");

        const progressText =
            document.getElementById("progressText");

        const totalCards =
            document.getElementById("totalCards");

        const currentCard =
            document.getElementById("currentCard");

        const remainingCards =
            document.getElementById("remainingCards");

        const modeButtons =
            document.querySelectorAll(".mode-btn");


        /* =====================================================
           INITIALIZE
        ===================================================== */

        function init() {

            totalCards.textContent =
                questions.length;

            shuffledIndices =
                Array.from(
                    {
                        length: questions.length
                    },
                    (_, index) => index
                );

            reviewIndices = [];

            updateCard();
            updateProgress();
        }


        /* =====================================================
           GET CURRENT DATA
        ===================================================== */

        function getCurrentData() {

            let index;

            if (mode === "random") {

                index =
                    shuffledIndices[currentIndex];

            } else if (mode === "review") {

                if (reviewIndices.length === 0) {

                    reviewIndices =
                        Array.from(
                            {
                                length: questions.length
                            },
                            (_, index) => index
                        );

                    shuffleArray(reviewIndices);
                }

                index =
                    reviewIndices[currentIndex];

            } else {

                index =
                    currentIndex;
            }

            return questions[index];
        }


        /* =====================================================
           UPDATE CARD
        ===================================================== */

        function updateCard() {

            const data =
                getCurrentData();

            kanjiDisplay.textContent =
                data.kanji;

            hiraganaDisplay.textContent =
                data.hiragana;

            meaningDisplay.textContent =
                data.meaning;

            card.classList.remove("flipped");

            isFlipped = false;

            flipBtn.textContent =
                "Balik Kartu";

            card.classList.remove("card-enter");

            void card.offsetWidth;

            card.classList.add("card-enter");
        }


        /* =====================================================
           UPDATE PROGRESS
        ===================================================== */

        function updateProgress() {

            const total =
                mode === "review"
                    ? reviewIndices.length
                    : questions.length;

            const progress =
                ((currentIndex + 1) / total) * 100;

            progressFill.style.width =
                `${progress}%`;

            progressText.textContent =
                `${currentIndex + 1} / ${total}`;

            currentCard.textContent =
                currentIndex + 1;

            remainingCards.textContent =
                Math.max(
                    0,
                    total - currentIndex - 1
                );

            prevBtn.disabled =
                currentIndex === 0;

            nextBtn.disabled =
                currentIndex >= total - 1;
        }


        /* =====================================================
           FLIP CARD
        ===================================================== */

        function flipCard() {

            card.classList.toggle("flipped");

            isFlipped =
                !isFlipped;

            flipBtn.textContent =
                isFlipped
                    ? "Balik Lagi"
                    : "Balik Kartu";
        }


        /* =====================================================
           NEXT CARD
        ===================================================== */

        function nextCard() {

            const total =
                mode === "review"
                    ? reviewIndices.length
                    : questions.length;

            if (currentIndex < total - 1) {

                currentIndex++;

                updateCard();
                updateProgress();
            }
        }


        /* =====================================================
           PREVIOUS CARD
        ===================================================== */

        function prevCard() {

            if (currentIndex > 0) {

                currentIndex--;

                updateCard();
                updateProgress();
            }
        }


        /* =====================================================
           SHUFFLE
        ===================================================== */

        function shuffleArray(array) {

            for (
                let i = array.length - 1;
                i > 0;
                i--
            ) {

                const j =
                    Math.floor(
                        Math.random() * (i + 1)
                    );

                [
                    array[i],
                    array[j]
                ] = [
                    array[j],
                    array[i]
                ];
            }

            return array;
        }


        /* =====================================================
           CHANGE MODE
        ===================================================== */

        function changeMode(newMode) {

            mode = newMode;

            currentIndex = 0;

            if (mode === "random") {

                shuffledIndices =
                    Array.from(
                        {
                            length: questions.length
                        },
                        (_, index) => index
                    );

                shuffleArray(shuffledIndices);
            }

            if (mode === "review") {

                reviewIndices =
                    Array.from(
                        {
                            length: questions.length
                        },
                        (_, index) => index
                    );

                shuffleArray(reviewIndices);
            }

            updateCard();
            updateProgress();

            modeButtons.forEach(button => {

                button.classList.toggle(
                    "active",
                    button.dataset.mode === mode
                );

            });
        }


        /* =====================================================
           EVENTS
        ===================================================== */

        card.addEventListener(
            "click",
            flipCard
        );

        flipBtn.addEventListener(
            "click",
            flipCard
        );

        nextBtn.addEventListener(
            "click",
            nextCard
        );

        prevBtn.addEventListener(
            "click",
            prevCard
        );


        /* =====================================================
           MODE BUTTONS
        ===================================================== */

        modeButtons.forEach(button => {

            button.addEventListener(
                "click",
                () => {
                    changeMode(
                        button.dataset.mode
                    );
                }
            );

        });


        /* =====================================================
           KEYBOARD
        ===================================================== */

        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === " " ||
                    event.key === "Enter"
                ) {

                    event.preventDefault();

                    flipCard();

                } else if (
                    event.key === "ArrowRight"
                ) {

                    nextCard();

                } else if (
                    event.key === "ArrowLeft"
                ) {

                    prevCard();
                }

            }
        );


        /* =====================================================
           START
        ===================================================== */

        init();

    </script>

</body>

</html>
